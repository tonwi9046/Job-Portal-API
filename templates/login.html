{% extends 'base.html' %}

{% block title %}Login - Job Portal{% endblock %}

{% block content %}

<div class="form-box">

    <h2>Login</h2>

    <form method="post">

        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn">
            Login
        </button>

    </form>

</div>

{% endblock %}
