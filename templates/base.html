{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Job Portal{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            <a href="/">Job Portal</a>
        </div>
        

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/jobs/">Jobs</a>
            <a href="/my-applications/">My Applications</a>
            <a href="/register/">Register</a>
            <a href="/api/login/">Login</a>
            <a href="/logout/">Logout</a>
        </div>

    </nav>


    <!-- Main Content -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="footer">
        <p>© 2026 Job Portal. All rights reserved.</p>
    </footer>

</body>
</html>
